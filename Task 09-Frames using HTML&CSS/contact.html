<!DOCTYPE html>
<html>

<head>

<style>

body{
    font-family:Arial;
    padding:40px;
}

table{
    border-collapse:collapse;
    width:400px;
}

td{
    padding:10px;
}

input,textarea{
    width:100%;
    padding:8px;
}

button{
    padding:10px 20px;
    background:#0d6efd;
    color:white;
    border:none;
    cursor:pointer;
}

</style>

</head>

<body>

<h1>Contact Us</h1>

<table>

<tr>
<td>Name</td>
<td><input type="text"></td>
</tr>

<tr>
<td>Email</td>
<td><input type="email"></td>
</tr>

<tr>
<td>Message</td>
<td><textarea rows="5"></textarea></td>
</tr>

<tr>
<td></td>
<td><button>Submit</button></td>
</tr>

</table>

</body>

</html>
