<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>
<body>

<h1>Student Registration Form</h1>

<form action="#" method="post" enctype="multipart/form-data">

<h2>Personal Information</h2>

<label>First Name:</label><br>
<input type="text" name="first_name" required><br><br>

<label>Last Name:</label><br>
<input type="text" name="last_name" required><br><br>

<label>Email:</label><br>
<input type="email" name="email" required><br><br>

<label>Phone Number:</label><br>
<input type="tel" name="phone" maxlength="10" required><br><br>

<label>Date of Birth:</label><br>
<input type="date" name="dob" required><br><br>

<label>Gender:</label><br>
<input type="radio" name="gender" value="Male"> Male
<input type="radio" name="gender" value="Female"> Female
<input type="radio" name="gender" value="Other"> Other
<br><br>

<label>Address:</label><br>
<textarea name="address" rows="4" cols="40"></textarea>
<br><br>

<h3>Courses Interested In</h3>

<input type="checkbox" name="course[]" value="HTML"> HTML<br>
<input type="checkbox" name="course[]" value="CSS"> CSS<br>
<input type="checkbox" name="course[]" value="JavaScript"> JavaScript<br>
<input type="checkbox" name="course[]" value="PHP"> PHP<br>
<input type="checkbox" name="course[]" value="Python"> Python<br><br>

<label>Year of Study:</label><br>

<input type="radio" name="year" value="1"> First Year<br>
<input type="radio" name="year" value="2"> Second Year<br>
<input type="radio" name="year" value="3"> Third Year<br>
<input type="radio" name="year" value="4"> Final Year<br><br>

<label>Department:</label><br>

<select name="department">
    <option value="">--Select Department--</option>
    <option value="Computer Science">Computer Science</option>
    <option value="Information Technology">Information Technology</option>
    <option value="Artificial Intelligence">Artificial Intelligence</option>
    <option value="Data Science">Data Science</option>
    <option value="Cyber Security">Cyber Security</option>
</select>

<br><br>

<label>Upload Photo:</label><br>
<input type="file" name="photo">
<br><br>

<h2>Account Information</h2>

<label>Username:</label><br>
<input type="text" name="username" required>
<br><br>

<label>Password:</label><br>
<input type="password" name="password" required>
<br><br>

<label>Confirm Password:</label><br>
<input type="password" name="confirm_password" required>
<br><br>

<input type="checkbox" name="agree" required>
I agree to the Terms and Conditions.
<br><br>

<input type="submit" value="Register">

<input type="reset" value="Reset">

<input type="button" value="Help" onclick="alert('Please fill all the required fields.')">

</form>

</body>
</html>
