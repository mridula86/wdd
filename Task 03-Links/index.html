<body align="center">

    <h1>PSGR Krishnammal College for Women</h1>

    <hr>

    <h2>Types of Links</h2>

        <a href="https://www.psgrkcw.ac.in" target="_blank">
            Visit PSGRKCW Official Website (Text Link)
        </a>
    </p>

        <img src="banner.png"
             alt="College Banner"
             width="600">
    </a>

    <br><br>

    <!-- Webpage Link -->
    <a href="https://www.google.com" target="_blank">
        Open Google
    </a>

</body>
</html>
